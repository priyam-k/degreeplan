<!doctype html>
<html lang="en" data-theme="eggshell-red">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMD Degree Planner</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Set the saved theme before first paint (src/ui/theme.ts keeps it in sync afterwards).
      try {
        var t = JSON.parse(localStorage.getItem("degreeplan.theme") || "{}");
        var g = t.ground && t.ground !== "auto" ? t.ground : matchMedia("(prefers-color-scheme: dark)").matches ? "charcoal" : "eggshell";
        document.documentElement.dataset.theme = g + "-" + (t.accent || "red");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
