# Rebuild public/courses.json twice a month so new schedules (spring in October,
# fall in March) and catalog edits show up. Commits only when the data changed,
# then redeploys. Pushes made with GITHUB_TOKEN don't trigger other workflows,
# so the deploy is called directly.
name: Refresh course catalog

on:
  schedule:
    - cron: "0 9 1,15 * *"
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch every semester (slow, an hour or more)
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: node scripts/fetch-courses.mjs
        env:
          FULL: ${{ inputs.full && '1' || '0' }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: commit
        run: |
          if git diff --quiet -- public/courses.json; then
            echo "Catalog unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh course catalog" -- public/courses.json
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
