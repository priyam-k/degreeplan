# Mathematics Minor — 2025-26 catalog (requirements text identical in 2026-27). See docs/research/minors.md.
# Format: README.md in this folder.

id: math-minor
name: Mathematics Minor
short: Math minor
kind: minor
college: Computer, Mathematical & Natural Sciences
aliases: [MATHEMATICS]

defs:
  NOT_UMD: { any: ["*"], except: "@umd" }
  # Every bucket except MATH310: 22 credits in all, 19 when exempt from MATH310 (3 cr).
  COUNTED: [calc3, linalg, theory, algebra, analysis, probability, extra]

buckets:
  - { id: calc3, label: MATH241 Calculus III (or 340), match: [MATH241, MATH340], courses: 1 }
  - { id: linalg, label: Linear algebra (MATH240/461/341), match: [MATH240, MATH461, MATH341], courses: 1 }
  - id: math310
    label: MATH310 Intro to Proof
    match: MATH310
    courses: 1
    note: "Exempt (waive) with B- or better in CMSC250, A- or better in MATH240 and 241, or B- or better in MATH340 and 341."
  - { id: theory, label: "Theory: MATH403/405/410", match: [MATH403, MATH405, MATH410], choose: 1 }
  - { id: algebra, label: "Algebra: MATH401/402/403/405/406/423", match: [MATH401, MATH402, MATH403, MATH405, MATH406, MATH423], choose: 1 }
  - { id: analysis, label: "Analysis: MATH410/416/462/463/464", match: [MATH410, MATH416, MATH462, MATH463, MATH464], choose: 1 }
  - id: probability
    label: "Probability: STAT400 or STAT410"
    match: [STAT400, STAT410, SURV410]
    choose: 1
    note: Others possible with Undergraduate Office approval (waive). ENEE324 is not accepted.
  - id: extra
    label: More 400-level MATH/STAT/AMSC (if needed for 22 cr)
    match:
      any: [MATH400-499, STAT400-499, AMSC400-499]
      except: [MATH400, MATH461, MATH477, MATH478, MATH480-484, MATH489, MATH498, STAT464]
    note: Only needed if the courses above total less than 22 credits (19 if exempt from MATH310).

constraints:
  - { kind: minFrom, id: credits, label: 22 credits (19 + MATH310), buckets: $COUNTED, match: "*", credits: 19 }
  - { kind: maxFrom, id: transfer-max, label: ≤ 2 courses taken elsewhere, buckets: [math310, ...$COUNTED], match: $NOT_UMD, courses: 2 }
  - kind: maxFrom
    id: transfer-400
    label: ≤ 1 400-level course taken elsewhere
    buckets: [math310, ...$COUNTED]
    match: { all: ["*400-999", $NOT_UMD] }
    courses: 1

notes:
  - Not open to Mathematics majors. A student may hold only one of the Mathematics, Statistics and Actuarial Mathematics minors.
  - C- or better in each minor course; 2.0 minor GPA.
  - Theory, algebra and analysis are counted as separate courses (the catalog's 22-23 credit total assumes four different 400-level courses); whether MATH403/405/410 may fill two of them at once is unconfirmed.
  - Declare the minor no later than one year before graduation (department application form).
sources:
  - https://academiccatalog.umd.edu/undergraduate/colleges-schools/computer-mathematical-natural-sciences/mathematics/mathematics-minor/
  - https://www-math.umd.edu/minors.html
