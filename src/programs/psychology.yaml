# UMD Psychology B.A. and B.S. — 2025-26 catalog. 2026-27 changes only the B.S. math/science
# totals (see notes). See docs/research/psychology.md.
# Format: README.md in this folder.

kind: major
college: Behavioral & Social Sciences
aliases: [PSYCHOLOGY]
sources: $SOURCES

defs:
  SOURCES:
    - https://academiccatalog.umd.edu/undergraduate/colleges-schools/behavioral-social-sciences/psychology/psychology-major/
    - https://psyc.umd.edu/undergraduate/degree-requirements-bs-and-ba
    - https://psyc.umd.edu/undergraduate/psyc-courses-psyc-syllabi
    - https://academiccatalog.umd.edu/undergraduate/colleges-schools/behavioral-social-sciences/
  BS_SOURCES:
    - https://psyc.umd.edu/sites/psyc.umd.edu/files/2025-03/BS%20Revised%202022_0.pdf

  NOTES:
    - C- or better in every PSYC course used for the major, except PSYC100 (or PSYC221 when PSYC100 came from AP), which needs a B-.
    - "Limited Enrollment Program: PSYC100 (B-), BSCI170 (C-) and MATH120/140 (C-) by the 45-credit review, a 2.0 UMD GPA, and a 2.7 GPA for students who change into the major."
    - MATH136 (and MATH130) count for the math gateway only for Biological Sciences majors (or MATH136 taken before declaring PSYC).
    - 2.0 GPA across all courses used for the major (BSOS).
    - "BSOS: 15 upper-level credits within the final 30 credits (sequencing; not checked here)."
    - The multicultural course is required of students who declared after Fall 2021 schedule adjustment.
    - At most 3 PSYC courses per semester (PSYC123, 303, 309G/P/R, 389, 478 and 479 don't count toward this cap).
    - PSYC123, 303, 309F/G/P/R, 389, 409, 468H, 469H, 478, 479, 498x and 499H never count toward the major.
    - PSYC309x/489x letters are reused for different topics. Themes here follow the department list; a topic missing from it counts toward the 25 credits but not a theme (ask an advisor, then waive).
    - PSYC489J is listed under Theme I (Human Brain Mapping) and Theme III (Advanced Statistics); this planner puts it in Theme I.

  # Department theme lists (psyc-courses-psyc-syllabi, current and Nov 2025 versions combined).
  THEME1:
    - [PSYC202, PSYC206, PSYC207, PSYC301, PSYC302, PSYC304, PSYC307, PSYC310, PSYC341, PSYC355]
    - [PSYC401, PSYC402, PSYC403, PSYC404, PSYC406, PSYC407, PSYC410, PSYC411, PSYC413, PSYC414, PSYC417]
    - [PSYC431, PSYC440, PSYC442, PSYC443, PSYC455, PSYC489G, PSYC489J, PSYC489N, PSYC489X]
  THEME2:
    - [PSYC210, PSYC234, PSYC262, PSYC330, PSYC332, PSYC336, PSYC337, PSYC344, PSYC353, PSYC381, PSYC391]
    - [PSYC425, PSYC432, PSYC433, PSYC434, PSYC435, PSYC436, PSYC437, PSYC444, PSYC445, PSYC457, PSYC459A]
    - [PSYC489A, PSYC489E, PSYC489M, PSYC489Q, PSYC489V, PSYC489W]
  THEME3:
    - [PSYC221, PSYC232, PSYC237, PSYC309D, PSYC309I, PSYC334, PSYC354, PSYC356, PSYC357, PSYC361, PSYC362]
    - [PSYC416, PSYC420, PSYC423, PSYC424, PSYC426, PSYC447, PSYC450, PSYC451, PSYC452, PSYC456]
    - [PSYC460, PSYC463, PSYC464, PSYC465, PSYC489F, PSYC489H, PSYC489I, PSYC489K, PSYC489P, PSYC489T, PSYC489Y]
    # Spring 2027 reuses these letters for other topics (Decoding the Brain; ADHD).
    - { any: [PSYC489C], except: { topic: PSYC489C, terms: [Spring 2027] } }
    - { any: [PSYC489O], except: { topic: PSYC489O, terms: [Spring 2027] } }
  MULTICULTURAL:
    - [PSYC232, PSYC262, PSYC336, PSYC354, PSYC391, PSYC447, PSYC489E, PSYC489F]
    - { topic: PSYC489Q, terms: [Spring 2026, Spring 2027] } # Psychology of the Black Experience
  # 4-credit labs (bold on the department list).
  LABS: [PSYC401, PSYC407, PSYC410, PSYC417, PSYC420, PSYC433, PSYC440, PSYC450, PSYC456, PSYC457, PSYC459A]
  NOT_APPLICABLE:
    - [PSYC303, PSYC309F, PSYC309G, PSYC309P, PSYC309R, PSYC389, PSYC409]
    - [PSYC468H, PSYC469H, PSYC478, PSYC479, PSYC498-498, PSYC499]

  CORE:
    - { id: psyc100, label: PSYC100 Intro to Psychology, match: PSYC100, courses: 1, note: B- or better (LEP gateway). }
    - PSYC200
    - PSYC300
    - id: electives
      label: 8 more PSYC courses (25 cr)
      match: { any: [PSYC200-499], except: [PSYC200, PSYC300, $NOT_APPLICABLE] }
      courses: 8
      credits: 25
      note: Any PSYC course that applies to the major. The theme, multicultural, 400-level and lab rules below pick from these.
    - { id: gateway-math, label: Math gateway (MATH120/140), match: [MATH120, MATH140, MATH130, MATH136], courses: 1, note: "C- or better. MATH130/136: Biological Sciences majors only." }
    - { id: gateway-bsci, label: BSCI170 Biology gateway, match: BSCI170, courses: 1, note: C- or better. }

  CORE_RULES:
    - { kind: minFrom, id: theme1, label: "≥ 2 from Theme I: Mind, Brain & Behavior", buckets: [electives], match: $THEME1, courses: 2 }
    - { kind: minFrom, id: theme2, label: "≥ 2 from Theme II: Mental Health & Interventions", buckets: [electives], match: $THEME2, courses: 2 }
    - { kind: minFrom, id: theme3, label: "≥ 2 from Theme III: Social, Developmental & Organizational", buckets: [electives], match: $THEME3, courses: 2 }
    - { kind: minFrom, id: multicultural, label: A multicultural PSYC course, buckets: [electives], match: $MULTICULTURAL, courses: 1 }
    - kind: minFrom
      id: upper400
      label: Two 400-level 3-credit (non-lab) PSYC courses
      buckets: [electives]
      match: { any: [PSYC400-499], except: [$LABS, $NOT_APPLICABLE] }
      courses: 2
    - { kind: minFrom, id: lab, label: A 4-credit PSYC lab, buckets: [electives], match: $LABS, courses: 1 }

