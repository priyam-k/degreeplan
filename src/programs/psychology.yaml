programs:
  - id: psyc-ba
    name: Psychology Major (B.A.)
    short: Psych (BA)
    buckets: $CORE
    constraints: $CORE_RULES
    notes: $NOTES

  - id: psyc-bs
    name: Psychology Major (B.S.)
    short: Psych (BS)
    buckets:
      - ...$CORE
      - id: bs-advanced
        label: B.S. advanced math/science (3 courses, 10 cr)
        match: $BS_LIST
        courses: 3
        credits: 10
        note: From the department's B.S. list. A PSYC course used here can't also count for a theme, the 400-level rule or the 25 credits.
    patch:
      gateway-bsci:
        label: BSCI170 (+ BSCI171 lab)
        match: [BSCI170, BSCI171]
        courses: 1
        maxCourses: 2
        note: C- or better in BSCI170. BSCI171 counts toward the B.S. math/science total and labs.
    constraints:
      - ...$CORE_RULES
      - { kind: minFrom, id: bsci170, label: BSCI170 Biology gateway, buckets: [gateway-bsci], match: BSCI170, courses: 1 }
      - { kind: minFrom, id: bs-lab, label: One B.S. advanced course is a lab, buckets: [bs-advanced], match: $BS_LABS, courses: 1 }
      - kind: minFrom
        id: bs-total
        label: "B.S. math & science: 5 courses / 17 cr"
        buckets: [gateway-math, gateway-bsci, bs-advanced]
        match: "*"
        courses: 5
        credits: 17
      - kind: minFrom
        id: bs-labs
        label: Two math/science lab courses (BSCI171 counts)
        buckets: [gateway-bsci, bs-advanced]
        match: [BSCI171, $BS_LABS]
        courses: 2
    notes:
      - ...$NOTES
      - The B.S. math/science courses need a 2.0 average together (a D can count if offset).
      - "2026-27 catalog: 5 courses / 16 credits with at least one lab, and BSCI171 is no longer named. This planner encodes 2025-26 (17 credits, two labs)."
      - BSCI338 special topics count only with PSYC advisor permission (waive). PSYC courses used for the B.S. must be added to the audit by an advisor.
    sources: ["...$SOURCES", "...$BS_SOURCES"]
